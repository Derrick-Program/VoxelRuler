name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      manual_tag:
        description: '手動發布的 Tag 名稱'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  verify-main:
    name: 🔍 Verify tag is on main
    runs-on: ubuntu-runner
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check tag commit is reachable from main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main 2>/dev/null; then
            echo "✅ Tag commit is on main branch"
          else
            echo "❌ Tag commit is NOT on main branch"
            exit 1
          fi
  build-linux:
    name: 📦 Package — Linux
    needs: verify-main
    runs-on: ubuntu-rust
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libssl-dev file binutils patchelf squashfs-tools fakeroot desktop-file-utils libfuse2 wget curl git shared-mime-info xdg-user-dirs libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package (Linux)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: cargo packager --release

      - name: Upload Linux artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/
          retention-days: 1

      - name: 🧹 Cleanup runner
        if: always()
        run: rm -rf target/ dist/

  build-windows:
    name: 📦 Package — Windows
    needs: verify-main
    runs-on: windows-latest
    defaults:
      run:
        shell: nu {0}
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package (Windows)
        run: cargo packager --release

      - name: Upload Windows artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/
          retention-days: 1

      - name: 🧹 Cleanup runner
        if: always()
        run: |
          for dir in [target, dist] {
            if ($dir | path exists) { rm -rf $dir }
          }
          let cargoGit = ($env.USERPROFILE | path join ".cargo" "git" "checkouts")
          if ($cargoGit | path exists) { rm -rf $cargoGit }

  release:
    name: 🚀 Create Forgejo Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-runner
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.manual_tag != ''
    steps:
      # 🎯 完整 URL：使用 Forgejo 專用修補版 Artifact 下載組件
      - name: Download Linux packages
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: linux-dist
          path: ./release-artifacts

      # 🎯 完整 URL：使用 Forgejo 專用修補版 Artifact 下載組件
      - name: Download Windows packages
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: windows-dist
          path: ./release-artifacts

      - name: List all release files
        run: |
          echo "=== Release files ==="
          find ./release-artifacts -type f | sort

      # 🎯 完整 URL：使用 Forgejo 官方原生發布組件
      - name: Create Native Forgejo Release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: ./release-artifacts
          tag: ${{ github.event.inputs.manual_tag || github.ref_name }}
          title: "VoxelRuler ${{ github.event.inputs.manual_tag || github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.event.inputs.manual_tag || github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Cleanup runner
        if: always()
        run: rm -rf ./release-artifacts/